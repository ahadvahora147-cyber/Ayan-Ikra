<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ayan & Ikra - Wedding Invitation</title>
  
  <!-- Google Fonts: Amiri (Arabic), Playfair Display (Serif), Montserrat -->
  <link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Amiri:ital,wght@0,400;0,700;1,400&family=Montserrat:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
  
  <style>
    /* Force Light Mode Color Scheme and block browser dark mode inversion */
    :root {
      color-scheme: light only;
      --bg-pink: #fbf2f5;
      --card-bg: #ffffff;
      --accent-rose: #d69bb0;
      --accent-silver: #a395a1;
      --text-dark: #4a343d;
      --text-muted: #735963;
      --border-rose: #ebd3de;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      background-color: #fbf2f5 !important;
      color: #4a343d !important;
    }

    body {
      font-family: 'Playfair Display', serif;
      background-color: var(--bg-pink);
      background-image: radial-gradient(circle, #fff7fa 0%, #f4e3eb 100%);
      color: var(--text-dark);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Music Toggle Button */
    .audio-control {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 90;
      background: rgba(255, 255, 255, 0.9) !important;
      border: 1px solid var(--accent-rose);
      border-radius: 50%;
      width: 45px;
      height: 45px;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(184, 155, 167, 0.3);
      font-size: 1.2rem;
      color: var(--text-dark) !important;
    }

    /* Video Opening Screen Overlay */
    .video-wrapper {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100vh;
      background-color: #2b1d23;
      z-index: 100;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: opacity 0.8s ease, visibility 0.8s ease;
    }

    .video-wrapper.hidden {
      opacity: 0;
      visibility: hidden;
    }

    #intro-video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      position: absolute;
      top: 0;
      left: 0;
    }

    .video-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(65, 42, 51, 0.45);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      z-index: 2;
    }

    .play-btn-circle {
      width: 75px;
      height: 75px;
      background: radial-gradient(circle, #fbf2f6 0%, #e8c3d3 50%, #b89ba7 100%);
      border: 2px solid #ffffff;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      color: var(--text-dark);
      font-size: 1.6rem;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.25);
      margin-bottom: 15px;
      transition: transform 0.3s ease;
    }

    .video-overlay:hover .play-btn-circle {
      transform: scale(1.1);
    }

    .overlay-text {
      font-family: 'Montserrat', sans-serif;
      font-size: 0.85rem;
      letter-spacing: 3px;
      color: #ffffff;
      text-transform: uppercase;
      text-align: center;
      text-shadow: 0 2px 4px rgba(0,0,0,0.4);
    }

    .skip-btn {
      position: absolute;
      bottom: 25px;
      right: 20px;
      z-index: 3;
      background: rgba(255, 255, 255, 0.9) !important;
      border: 1px solid var(--accent-rose);
      color: var(--text-dark) !important;
      padding: 8px 18px;
      border-radius: 20px;
      font-family: 'Montserrat', sans-serif;
      font-size: 0.75rem;
      letter-spacing: 1px;
      text-transform: uppercase;
      cursor: pointer;
    }

    /* Main Invitation Container */
    .invitation-container {
      display: none;
      width: 100%;
      max-width: 460px;
      padding: 25px 15px;
      opacity: 0;
      transform: translateY(30px);
      transition: opacity 1s ease, transform 1s ease;
    }

    .invitation-container.visible {
      display: block;
      opacity: 1;
      transform: translateY(0);
    }

    /* Cards */
    .card {
      background-color: var(--card-bg) !important;
      border: 1px solid var(--border-rose);
      border-radius: 16px;
      padding: 35px 25px;
      margin-bottom: 22px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(115, 89, 99, 0.08);
      position: relative;
    }

    .arabic-bismillah {
      font-family: 'Amiri', serif;
      font-size: 1.8rem;
      color: var(--accent-rose);
      margin-bottom: 12px;
    }

    .arabic-quote {
      font-family: 'Amiri', serif;
      font-size: 1.4rem;
      color: var(--text-dark);
      margin: 15px 0 6px;
      direction: rtl;
    }

    .quote-translation {
      font-family: 'Montserrat', sans-serif;
      font-size: 0.75rem;
      color: var(--text-muted);
      font-style: italic;
      margin-bottom: 12px;
    }

    .subtitle {
      font-family: 'Montserrat', sans-serif;
      font-size: 0.7rem;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--accent-silver);
      margin-bottom: 12px;
    }

    .names {
      font-size: 2.6rem;
      font-weight: 600;
      line-height: 1.2;
      margin: 12px 0;
      color: var(--text-dark);
      letter-spacing: 1px;
    }

    .ampersand {
      font-family: 'Alex Brush', cursive;
      font-size: 2.5rem;
      color: var(--accent-rose);
      display: block;
      margin: -5px 0;
    }

    /* Live Countdown Grid */
    .countdown-grid {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin: 20px 0 10px;
    }

    .time-box {
      background: #fcf4f7 !important;
      border: 1px solid var(--border-rose);
      border-radius: 10px;
      padding: 10px;
      min-width: 65px;
    }

    .time-num {
      font-size: 1.4rem;
      font-weight: 600;
      color: var(--accent-rose);
    }

    .time-label {
      font-family: 'Montserrat', sans-serif;
      font-size: 0.55rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-muted);
    }

    /* Function Cards Styling */
    .function-badge {
      display: inline-block;
      background: #f7eaf0 !important;
      color: var(--text-dark);
      font-family: 'Montserrat', sans-serif;
      font-size: 0.65rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      padding: 5px 15px;
      border-radius: 15px;
      border: 1px solid var(--border-rose);
      margin-bottom: 15px;
    }

    .event-heading {
      font-size: 1.8rem;
      color: var(--text-dark);
      margin-bottom: 5px;
    }

    .event-datetime {
      font-family: 'Montserrat', sans-serif;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--accent-rose);
      margin: 8px 0;
    }

    .event-desc {
      font-family: 'Montserrat', sans-serif;
      font-size: 0.82rem;
      color: var(--text-muted);
      line-height: 1.6;
      margin-top: 10px;
    }

    .theme-tag {
      display: inline-block;
      margin-top: 12px;
      background: #faf2f6 !important;
      border: 1px dashed var(--accent-rose);
      padding: 6px 12px;
      border-radius: 8px;
      font-family: 'Montserrat', sans-serif;
      font-size: 0.75rem;
      color: var(--text-dark);
    }

    /* Buttons */
    .btn {
      display: inline-block;
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #e8c3d3, #b89ba7) !important;
      color: #ffffff !important;
      font-weight: 600;
      text-decoration: none;
      font-family: 'Montserrat', sans-serif;
      font-size: 0.8rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      border-radius: 30px;
      border: none;
      cursor: pointer;
      margin-top: 15px;
      box-shadow: 0 4px 15px rgba(184, 155, 167, 0.4);
